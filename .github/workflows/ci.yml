name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      - run: pnpm -F @desk365/web exec tsc --noEmit
      - run: pnpm -F @desk365/cms exec tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      SITE_URL:         https://www.desk365.io
      PAYLOAD_API_URL:  https://cms.desk365.io
      PAYLOAD_SECRET:   ci-secret-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      - run: pnpm -F @desk365/web build
